name: Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Lockfile if Missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npm run build:css || echo "Tailwind build skipped"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Auto-Signing Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 \
          -alias calculator-alias -storepass password123 -keypass password123 \
          -dname "CN=Calculator User, OU=Personal, O=Self, L=Urgench, C=UZ"

      - name: Sign and Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/release.jks \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=calculator-alias \
            -Pandroid.injected.signing.key.password=password123

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-advanced-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
