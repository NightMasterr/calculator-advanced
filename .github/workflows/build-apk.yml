name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Lockfile if Missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Tailwind CSS
        run: npm run build:css || echo "Tailwind build skipped"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Debug Signing on Release Build
        run: |
          # This injects a standard signing config so the APK comes out signed and installable
          BUILD_FILE="android/app/build.gradle"
          if grep -q "signingConfig signingConfigs.debug" "$BUILD_FILE"; then
            echo "Signing config already present"
          else
            sed -i '/buildTypes {/,/release {/s/release {/release {\n            signingConfig signingConfigs.debug/' "$BUILD_FILE"
          fi

      - name: Build Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare Direct APK Artifact
        run: |
          mkdir -p final-apk
          # Gradle outputs the signed release APK as app-release.apk when signed via debug config
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk final-apk/calculator-advanced.apk
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk final-apk/calculator-advanced.apk
          fi

      - name: Upload Direct APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Advanced-APK
          path: final-apk/calculator-advanced.apk
